<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Enterprise Dashboard - Accessible</title>
<style>
body{font-family:Arial,sans-serif;margin:0;display:grid;grid-template-areas:"header header" "nav main" "nav aside" "footer footer";grid-template-columns:200px 1fr;gap:10px}
header{grid-area:header;background:#1a1a1a;color:#fff;padding:1rem}
nav{grid-area:nav;background:#f4f4f4;padding:1rem}
main{grid-area:main;padding:1rem}
aside{grid-area:aside;background:#fafafa;padding:1rem;border-left:2px solid #ddd}
footer{grid-area:footer;background:#1a1a1a;color:#fff;padding:1rem;text-align:center}
table{width:100%;border-collapse:collapse}th,td{border:1px solid #ccc;padding:8px}
.modal{display:none;position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:#fff;padding:2rem;box-shadow:0 0 10px #000}
</style>
</head>
<body>
<header role="banner"><h1>Enterprise Dashboard</h1></header>
<nav role="navigation" aria-label="Main menu"><h2>Navigation</h2><ul><li><a href="#dash">Dashboard</a></li><li><a href="#reports">Reports</a></li><li><a href="#settings">Settings</a></li></ul></nav>
<main role="main" id="main-content">
<section aria-labelledby="dash-title"><h2 id="dash-title">Dashboard</h2>
<article><h3>Sales Data</h3>
<table aria-label="Sales report"><caption>Monthly Sales Report</caption><thead><tr><th scope="col">Month</th><th scope="col">Revenue</th><th scope="col">Growth</th></tr></thead><tbody><tr><td>Jan</td><td>$50k</td><td>12%</td></tr><tr><td>Feb</td><td>$55k</td><td>10%</td></tr></tbody></table>
</article></section>
<section aria-labelledby="form-title"><h2 id="form-title">User Form</h2>
<form aria-label="User form"><fieldset><legend>Details</legend>
<label for="name">Name:</label><input type="text" id="name" required aria-required="true"><br><br>
<label for="email">Email:</label><input type="email" id="email" required aria-describedby="email-help"><span id="email-help"> - will not be shared</span><br><br>
<button type="submit">Submit</button></fieldset></form></section>
<button aria-haspopup="dialog" aria-controls="modal1" onclick="document.getElementById('modal1').style.display='block'">Open Modal</button>
<div id="modal1" class="modal" role="dialog" aria-modal="true" aria-labelledby="m-title"><h2 id="m-title">Modal</h2><p>Accessible dialog example</p><button onclick="this.parentElement.style.display='none'" aria-label="Close">Close</button></div>
</main>
<aside role="complementary"><h2>Quick Stats</h2><p>Enterprise metrics here</p></aside>
<footer role="contentinfo"><p>&copy; 2026 Dashboard</p></footer>
</body>
</html>
